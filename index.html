<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBEFD9">
  <title>Crown the Cub</title>
  <meta name="description" content="Cờ thú 3×4 – chơi với máy hoặc với bạn.">
  <style>
    :root {
      --page: #fbefd9;
      --ink: #4a2614;
      --muted: #8a6a44;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --page: #2a1c12; --ink: #fbefd9; --muted: #c9a97f; }
    }
    :root[data-theme="dark"] { --page: #2a1c12; --ink: #fbefd9; --muted: #c9a97f; }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    main {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* The game is laid out for a 390 × 844 phone screen. */
    .stage {
      position: relative;
      height: 100%;
      max-height: 100dvh;
      aspect-ratio: 390 / 844;
      max-width: 100vw;
      container-type: size;        /* lets the sound button size itself in cqw */
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;          /* taps and drags go to the game, not the page */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      font-size: 15px;
      color: var(--muted);
      pointer-events: none;
    }
    .status[hidden] { display: none; }
    .sound {
      position: absolute;
      /* Beside the bot's tray: the corners hold the Menu and Hints buttons in play. */
      top: 14.8%;
      right: 1.5%;
      /* Same width and height, both from the stage width, so the circle never
         stretches (aspect-ratio and % padding on <button> are unreliable in Safari). */
      width: 10.5%;
      aspect-ratio: 1;
      width: 10.5cqw;
      height: 10.5cqw;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      display: grid;
      place-items: center;
      -webkit-appearance: none;
      appearance: none;
      line-height: 0;
      border: 2px solid #7a4a22;
      border-radius: 50%;
      background: #fff6e3;
      color: #7a4a22;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .sound[hidden] { display: none; }
    .sound:focus-visible { outline: 3px solid #e3a534; outline-offset: 2px; }
    .sound svg { display: block; width: 58%; height: 58%; flex: none; }
    .sound .off { display: none; }
    .sound[aria-pressed="true"] .on { display: none; }
    .sound[aria-pressed="true"] .off { display: inline; }
    .status strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <canvas id="game" aria-label="Crown the Cub"></canvas>
      <div class="status" id="status">Đang tải…</div>
      <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Tắt tiếng" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/>
          <path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/>
          <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.47.1/rive.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('game');
      var status = document.getElementById('status');

      function fail(message) {
        status.hidden = false;
        status.innerHTML = '<div><strong>Không tải được game</strong>' + message + '</div>';
      }

      if (location.protocol === 'file:') {
        fail('Hãy mở trang qua một web server (ví dụ <code>python3 -m http.server</code>), không mở trực tiếp file.');
        return;
      }
      if (!window.rive) {
        fail('Không tải được Rive runtime từ CDN. Kiểm tra kết nối mạng.');
        return;
      }

      // Background music plays here; sound effects play from inside the .riv.
      // bgm.mp3 repeats its loop's edges around it, so the loop points stay seamless
      // whatever delay the MP3 decoder adds.
      var MUSIC_URL = 'audio/bgm.mp3';
      var LOOP_START = 0.25;
      var LOOP_END = 113.43033;
      var MUSIC_LEVEL = 0.6;
      var DUCKED_LEVEL = 0.12;
      var RESULT_SOUND_SECONDS = 4.2;
      var UNLOCK_EVENTS = ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'];

      var soundButton = document.getElementById('sound');
      var muted = false;
      var ducked = false;
      var duckTimer = 0;
      var audioContext = null;
      var musicGain = null;
      var musicData = null;
      var musicStarted = false;
      var game = null;

      try { muted = localStorage.getItem('crown-the-cub-muted') === '1'; } catch (e) {}

      function applyMusicLevel() {
        if (!musicGain) return;
        var level = muted ? 0 : (ducked ? DUCKED_LEVEL : MUSIC_LEVEL);
        musicGain.gain.setTargetAtTime(level, audioContext.currentTime, 0.12);
      }

      function applySound() {
        soundButton.setAttribute('aria-pressed', muted ? 'true' : 'false');
        soundButton.setAttribute('aria-label', muted ? 'Bật tiếng' : 'Tắt tiếng');
        if (game) game.volume = muted ? 0 : 1;
        applyMusicLevel();
      }

      function startMusic() {
        if (musicStarted || !audioContext || !musicData) return;
        musicStarted = true;
        audioContext.decodeAudioData(musicData, function (buffer) {
          var source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.loop = true;
          source.loopStart = LOOP_START;
          source.loopEnd = LOOP_END;
          source.connect(musicGain);
          source.start(0, LOOP_START);
        }, function () {});
      }

      // Browsers only allow sound after the player touches the page.
      function unlockAudio() {
        var Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;
        if (!audioContext) {
          audioContext = new Context();
          musicGain = audioContext.createGain();
          musicGain.gain.value = 0;
          musicGain.connect(audioContext.destination);
          applyMusicLevel();
          startMusic();
        }
        audioContext.resume();
        if (audioContext.state === 'running') {
          UNLOCK_EVENTS.forEach(function (name) {
            document.removeEventListener(name, unlockAudio, true);
          });
        }
      }
      UNLOCK_EVENTS.forEach(function (name) {
        document.addEventListener(name, unlockAudio, true);
      });

      document.addEventListener('visibilitychange', function () {
        if (!audioContext) return;
        if (document.hidden) audioContext.suspend(); else audioContext.resume();
      });

      soundButton.addEventListener('click', function () {
        muted = !muted;
        try { localStorage.setItem('crown-the-cub-muted', muted ? '1' : '0'); } catch (e) {}
        applySound();
      });

      fetch(MUSIC_URL).then(function (response) {
        if (!response.ok) throw new Error('music');
        return response.arrayBuffer();
      }).then(function (data) {
        musicData = data;
        startMusic();
      }).catch(function () {});

      // The music steps back while the win or lose sound plays.
      function duckMusic() {
        ducked = true;
        applyMusicLevel();
        clearTimeout(duckTimer);
        duckTimer = setTimeout(function () {
          ducked = false;
          applyMusicLevel();
        }, RESULT_SOUND_SECONDS * 1000);
      }

      function listenForResultSounds() {
        var data = game.viewModelInstance;
        if (!data) return;
        ['sfxWin', 'sfxLose'].forEach(function (name) {
          var trigger = data.trigger(name);
          if (trigger) trigger.on(duckMusic);
        });
      }

      game = new rive.Rive({
        src: 'myproject.riv',
        canvas: canvas,
        artboard: 'Main',
        stateMachines: 'Flow Machine',
        autoplay: true,
        autoBind: true,           // binds the file's default view model instance
        layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
        onLoad: function () {
          status.hidden = true;
          game.resizeDrawingSurfaceToCanvas();
          soundButton.hidden = false;
          applySound();
          listenForResultSounds();
        },
        onLoadError: function () {
          fail('File myproject.riv không mở được.');
        }
      });

      var resizeTimer = 0;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { game.resizeDrawingSurfaceToCanvas(); }, 60);
      });
    })();
  </script>
</body>
</html>
